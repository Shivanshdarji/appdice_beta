<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1" name="viewport" />
  <title>AppDice - Podcast</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans&display=swap');
    body {
      font-family: 'Anton', sans-serif;
      background-color: #051650;
      color: #ffffff;
      padding-top: 80px; /* Add padding to account for fixed header */
    }
    .font-anton {
      font-family: 'Anton', sans-serif;
    }
    .font-opensans {
      font-family: 'Open Sans', sans-serif;
    }
    /* Microanimation for header links */
    .nav-link {
      position: relative;
      transition: color 0.3s ease;
      color: #ffffff;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -4px;
      left: 50%;
      background-color: #ffffff;
      transition: width 0.3s ease, left 0.3s ease;
      border-radius: 2px;
    }
    .nav-link:hover {
      color: #cccccc;
    }
    .nav-link:hover::after {
      width: 100%;
      left: 0;
    }
    .logo-font {
      font-family: 'Anton', sans-serif;
      letter-spacing: 0.15em;
    }
    /* Header styles */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: #051650;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 200, 87, 0.2);
    }
    /* Mobile menu styles */
    @media (max-width: 768px) {
      .mobile-menu {
        display: none;
      }
      .mobile-menu.active {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 80px;
        right: 0;
        background-color: #051650;
        padding: 1rem;
        z-index: 50;
        border-left: 1px solid #FFC857;
        border-bottom: 1px solid #FFC857;
        border-radius: 0 0 0 8px;
        min-width: 200px;
        box-shadow: -2px 2px 10px rgba(0, 0, 0, 0.2);
      }
      .mobile-menu a {
        padding: 0.75rem 1.5rem;
        text-align: right;
      }
      .mobile-menu a:hover {
        background-color: rgba(255, 200, 87, 0.1);
      }
    }
  </style>
</head>
<body class="bg-[#051650] min-h-screen flex flex-col">
  <!-- Header -->
  <header class="flex justify-between items-center py-4 md:py-8 px-4 md:px-8 max-w-full">
    <h1 class="text-2xl md:text-4xl font-extrabold cursor-default select-none logo-font tracking-tight ml-0">
      <span class="text-[#FFC857]">App</span><span class="text-white">Dice</span>
    </h1>
    <nav class="space-x-6 hidden md:flex mr-6">
      <a class="nav-link text-lg font-semibold uppercase tracking-wide" href="index (1).html">
        Home
      </a>
      <a class="nav-link text-lg font-semibold uppercase tracking-wide" href="About Us.html">
        About Us
      </a>
      <a class="nav-link text-lg font-semibold uppercase tracking-wide" href="Services.html">
        Services
      </a>
      <a class="nav-link text-lg font-semibold uppercase tracking-wide active" href="podcast.html">
        Podcast
      </a>
    </nav>
    <!-- Mobile menu button -->
    <button class="md:hidden text-white text-2xl" id="mobileMenuButton">
      <i class="fas fa-bars"></i>
    </button>
  </header>
  <!-- Mobile menu -->
  <div class="mobile-menu md:hidden" id="mobileMenu">
    <a class="nav-link text-lg font-semibold uppercase tracking-wide block" href="index (1).html">
      Home
    </a>
    <a class="nav-link text-lg font-semibold uppercase tracking-wide block" href="About Us.html">
      About Us
    </a>
    <a class="nav-link text-lg font-semibold uppercase tracking-wide block" href="Services.html">
      Services
    </a>
    <a class="nav-link text-lg font-semibold uppercase tracking-wide block" href="podcast.html">
      Podcast
    </a>
  </div>

  <div class="flex-grow flex flex-col items-center justify-center px-4 text-center text-white py-8 md:py-0">
    <h1 class="font-anton text-[3rem] sm:text-[4rem] md:text-[6rem] lg:text-[8rem] leading-[1] mb-4 md:mb-6">
      COMING SOON
    </h1>
    <p class="font-opensans text-base md:text-lg max-w-xl mb-8 md:mb-12 px-4">
      We are working hard to bring you something amazing. Stay tuned and be part of the journey.
    </p>
    <a href="https://www.instagram.com/appdice/" target="_blank" rel="noopener noreferrer" class="inline-block bg-white text-[#051650] font-anton text-lg md:text-xl px-8 md:px-10 py-3 md:py-4 rounded-full hover:opacity-80 transition-opacity duration-300">
      Notify Me
    </a>
  </div>

  <script>
    // Mobile menu toggle
    const mobileMenuButton = document.getElementById('mobileMenuButton');
    const mobileMenu = document.getElementById('mobileMenu');
    
    mobileMenuButton.addEventListener('click', () => {
      mobileMenu.classList.toggle('active');
    });
  </script>
</body>
</html>
