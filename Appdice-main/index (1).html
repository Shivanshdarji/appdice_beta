   body {

   /* Microanimation for header links */
   .nav-link {
     position: relative;
     transition: color 0.3s ease;
     color: #ffffff;
   }
   .nav-link::after {
     content: '';
     position: absolute;
     width: 0;
     height: 2px;
     bottom: -4px;
     left: 50%;
     background-color: #ffffff;
     transition: width 0.3s ease, left 0.3s ease;
     border-radius: 2px;
   }
   .nav-link:hover {
     color: #cccccc;
   }
   .nav-link:hover::after {
     width: 100%;
     left: 0;
   }
   /* Mobile menu styles */
   @media (max-width: 768px) {
     .mobile-menu {
       display: none;
     }
     .mobile-menu.active {
       display: flex;
       flex-direction: column;
       position: fixed;
       top: 80px;
       right: 0;
       background-color: #051650;
       padding: 1rem;
       z-index: 50;
       border-left: 1px solid #FFC857;
       border-bottom: 1px solid #FFC857;
       border-radius: 0 0 0 8px;
       min-width: 200px;
       box-shadow: -2px 2px 10px rgba(0, 0, 0, 0.2);
     }
     .mobile-menu a {
       padding: 0.75rem 1.5rem;
       text-align: right;
     }
     .mobile-menu a:hover {
       background-color: rgba(255, 200, 87, 0.1);
     }
   }
  </style>
